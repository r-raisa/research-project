model:
  project_model_scope: "laptop_scale_open_source_instruct_model"

  primary_model_id: "Qwen/Qwen2.5-0.5B-Instruct"
  stretch_model_id: "Qwen/Qwen2.5-1.5B-Instruct"

  original_planned_model_id: "meta-llama/Meta-Llama-3-8B-Instruct"
  original_planned_model_status: "Not used for laptop-only experiments because local compute is limited."

  device_preference:
    - "mps"
    - "cpu"

  torch_dtype: "float32"

  max_seq_length: 1024

  notes: >
    Due to the constraints of this project, the actual experimental model used was a smaller open-source
    instruct model so that SFT, DPO, and evaluation could be completed locally. Final successful
    SFT and DPO training were run on CPU using float32 after MPS/float16 attempts were unstable
    or exceeded local memory.