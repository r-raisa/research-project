training:
  seed: 42

  sft:
    enabled: true
    num_train_epochs: 2
    learning_rate: 0.0002
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    max_seq_length: 1024
    save_strategy: "epoch"
    logging_steps: 10

  dpo:
    enabled: true
    num_train_epochs: 1
    learning_rate: 0.00005
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    beta: 0.1
    max_seq_length: 1024
    save_strategy: "epoch"
    logging_steps: 10

  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"

  laptop_constraints:
    use_cuda: false
    use_bitsandbytes: false
    use_mps_if_available: true
    run_small_pilot_first: true