seed: 42

datasets:
  esconv:
    hf_id: "thu-coai/esconv"
    use: true
    purpose: "Main source of emotional-support dialogue examples."

  counsel_chat:
    hf_id: "nbertagnolli/counsel-chat"
    use: true
    purpose: "Mental-health-style questions for prompt pool."

  empathetic_dialogues:
    hf_id: "brianist/empathetic_dialogues"
    use: true
    purpose: "General empathy-style dialogue data in parquet format."


synthetic_safety:
  use: true
  path: "data/processed/synthetic_safety_prompts.jsonl"
  expected_total: 180
  purpose: "Controlled synthetic prompts for safety, crisis escalation, boundaries, harmful-advice refusal, medication boundaries, over-reassurance and fairness evaluation."
  expected_categories:
    crisis_risk_direct: 20
    crisis_risk_ambiguous: 20
    harmful_advice: 20
    diagnosis_boundary: 20
    medication_boundary: 20
    privacy_dependence: 20
    over_reassurance_trap: 20
    bias_fairness: 40


prompt_categories:
  - everyday_stress
  - anxiety
  - low_mood
  - loneliness
  - relationship_distress
  - crisis_risk
  - privacy_boundary
  - bias_fairness
  - over_reassurance
  - diagnosis_boundary

target_counts:
  train_prompts: 500
  test_prompts: 100
  validation_fraction: 0.1
  test_fraction: 0.2

text_cleaning:
  min_chars: 20
  max_chars: 1200
  remove_duplicates: true

prompt_pool:
  output_path: "data/processed/prompt_pool.jsonl"
  response_candidates_path: "data/processed/response_candidates.jsonl"
  report_path: "docs/prompt_pool_report.md"

  include_sources:
    synthetic_safety: true
    counsel_chat: true
    esconv: true
    empathetic_dialogues: true

  extraction_limits:
    counsel_chat_max_prompts: null
    esconv_max_conversations: null
    esconv_include_usr_dialog_turns: true
    esconv_max_dialog_turn_prompts: 500
    empathetic_dialogues_max_prompts: 300

  text_filtering:
    min_prompt_chars: 25
    max_prompt_chars: 1200
    remove_duplicates: true
    skip_greetings: true

splits:
  seed: 42

  input_prompt_pool_path: "data/processed/prompt_pool.jsonl"

  output_paths:
    train: "data/splits/train_prompts.jsonl"
    validation: "data/splits/validation_prompts.jsonl"
    test: "data/splits/test_prompts_LOCKED.jsonl"
    summary: "data/splits/split_summary.json"
    report: "docs/data_split_report.md"

  public_split:
    train_fraction: 0.80
    validation_fraction: 0.10
    test_fraction: 0.10
    minimum_test_per_category: 5
    minimum_validation_per_category: 3

  synthetic_safety_split:
    non_fairness_train_per_category: 12
    non_fairness_validation_per_category: 4
    non_fairness_test_per_category: 4

    fairness_train_pairs: 12
    fairness_validation_pairs: 4
    fairness_test_pairs: 4


response_pairing:
  seed: 42

  input_paths:
    train_prompts: "data/splits/train_prompts.jsonl"
    validation_prompts: "data/splits/validation_prompts.jsonl"
    locked_test_prompts: "data/splits/test_prompts_LOCKED.jsonl"

  pairing_prompt_outputs:
    train: "data/splits/train_pairing_prompts.jsonl"
    validation: "data/splits/validation_pairing_prompts.jsonl"

  pilot_outputs:
    train_sft: "data/splits/train_sft_pilot.jsonl"
    train_dpo: "data/splits/train_dpo_pilot.jsonl"
    validation_sft: "data/splits/validation_sft_pilot.jsonl"
    validation_dpo: "data/splits/validation_dpo_pilot.jsonl"
    report: "docs/response_pair_pilot_report.md"

  main_outputs:
    train_sft: "data/splits/train_sft.jsonl"
    train_dpo: "data/splits/train_dpo.jsonl"
    validation_sft: "data/splits/validation_sft.jsonl"
    validation_dpo: "data/splits/validation_dpo.jsonl"
    report: "docs/response_pair_report.md"

  subset_sizes:
    pilot_train_total: 50
    pilot_validation_total: 20
    main_train_total: 600
    main_validation_total: 120

  sampling_policy:
    include_all_synthetic_safety_in_main: true
    stratify_public_by_category: true